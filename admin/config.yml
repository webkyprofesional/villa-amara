backend:
  name: github
  repo: webkyprofesional/villa-amara
  branch: main
  base_url: https://villa-amara.vercel.app
  auth_endpoint: api/auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "sk"

collections:
  - name: "content"
    label: "Obsah stránky"
    files:
      - file: "data/content.json"
        label: "Villa Amara — obsah"
        name: "content"
        fields:
          - { label: "Podnadpis nad názvom (úvod)", name: "heroEyebrow", widget: "string" }
          - { label: "Názov vily", name: "heroTitle", widget: "string" }
          - { label: "Text v sekcii O vile", name: "aboutText", widget: "text" }
          - label: "Štatistiky (O vile)"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Číslo / hodnota", name: "num", widget: "string" }
              - { label: "Popis", name: "label", widget: "string" }
          - label: "Galéria (4 fotky)"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Obrázok", name: "image", widget: "image" }
              - { label: "Popis obrázka (alt text)", name: "alt", widget: "string" }
          - label: "Vybavenie (6 položiek)"
            name: "amenities"
            widget: "list"
            field: { label: "Text", name: "text", widget: "string" }
          - { label: "Citát (nad kontaktom)", name: "quote", widget: "text", hint: "Nový riadok = zalomenie textu" }
          - label: "Kontakt"
            name: "contact"
            widget: "object"
            fields:
              - { label: "E-mail", name: "email", widget: "string" }
              - { label: "Telefón (zobrazený)", name: "phone", widget: "string" }
              - { label: "Telefón (pre odkaz tel:, bez medzier)", name: "phoneHref", widget: "string" }
              - { label: "Lokalita", name: "location", widget: "string" }
